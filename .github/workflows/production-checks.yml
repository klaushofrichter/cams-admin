name: PR checks

on:
  pull_request:
    branches: [main, production]

# Least privilege for the PR checks; the codeql job asks for more itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      # Type-check server, test-client, scripts, test/ and e2e/.
      - run: npm run lint:types
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npm run check:svelte
      - run: npm audit --audit-level=high
      # Spec §13.6: Litestream + MinIO (docker), restore from the replica and
      # from the snapshot, compare, and a test-client hello on each copy.
      - name: Restore test
        run: scripts/backup/restore-test.sh
      # Spec §15.4: cam-proxy main's real buildHealth() against the strict
      # heartbeat schema. A network failure fails the step.
      - name: Contract cross-check with cam-proxy main (heartbeat and commands)
        run: scripts/contract/cam-proxy-check.sh
      # Spec §15.4: the short load test (the full hour runs on a Mac).
      - name: Load test (short)
        run: npm run load -- --proxies 20 --cameras 4 --duration 2m --heartbeat 5

  e2e:
    # GitHub-hosted only: a browser on the self-hosted runner gets OOM-killed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never
      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          accepted=.github/codeql-accepted.tsv
          blocking=0
          for f in sarif-results/*.sarif; do
            while IFS=$'\t' read -r rule uri line message; do
              [ -n "$rule" ] || continue
              if grep -v '^#' "$accepted" | awk -F'\t' -v r="$rule" -v p="$uri" '$1==r && $2==p {found=1} END {exit !found}'; then
                echo "::notice::CodeQL $rule at $uri:$line — accepted exception, see $accepted"
              else
                echo "::error::CodeQL $rule — $message"
                echo "    at $uri:$line"
                blocking=$((blocking + 1))
              fi
            done < <(jq -r '.runs[].results[]
              | select((.suppressions // []) | length == 0)
              | [.ruleId,
                 .locations[0].physicalLocation.artifactLocation.uri,
                 (.locations[0].physicalLocation.region.startLine | tostring),
                 .message.text] | @tsv' "$f")
          done
          echo "CodeQL blocking findings: $blocking"
          [ "$blocking" -eq 0 ] || { echo "::error::CodeQL found $blocking unaccepted finding(s)"; exit 1; }
